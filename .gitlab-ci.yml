################
# DrupalCI GitLabCI template
#
# Gitlab-ci.yml to replicate DrupalCI testing for Contrib
#
# With thanks to:
#   * The GitLab Acceleration Initiative participants
#   * DrupalSpoons
################

################
# Guidelines
#
# This template is designed to give any Contrib maintainer everything they need to test, without requiring modification. It is also designed to keep up to date with Core Development automatically through the use of include files that can be centrally maintained.
#
# However, you can modify this template if you have additional needs for your project.
################

################
# Includes
#
# Additional configuration can be provided through includes.
# One advantage of include files is that if they are updated upstream, the changes affect all pipelines using that include.
#
# Includes can be overridden by re-declaring anything provided in an include, here in gitlab-ci.yml
# https://docs.gitlab.com/ee/ci/yaml/includes.html#override-included-configuration-values
################

include:
  ################
  # DrupalCI includes:
  # As long as you include this, any future includes added by the Drupal Association will be accessible to your pipelines automatically.
  # View these include files at https://git.drupalcode.org/project/gitlab_templates/
  ################
  - project: $_GITLAB_TEMPLATES_REPO
    ref: $_GITLAB_TEMPLATES_REF
    file:
      - '/includes/include.drupalci.main.yml'
      - '/includes/include.drupalci.variables.yml'
      - '/includes/include.drupalci.workflows.yml'

################
# Pipeline configuration variables
#
# These are the variables provided to the Run Pipeline form that a user may want to override.
#
# Docs at https://git.drupalcode.org/project/gitlab_templates/-/blob/1.0.x/includes/include.drupalci.variables.yml
################
variables:
  OPT_IN_TEST_PREVIOUS_MAJOR: 1
  OPT_IN_TEST_PREVIOUS_MINOR: 1
  OPT_IN_TEST_NEXT_MINOR: 1
  OPT_IN_TEST_NEXT_MAJOR: 1
  CORE_PREVIOUS_PHP_MIN: 8.1
  _PHPUNIT_EXTRA: '--no-coverage --configuration=phpunit.gitlab-ci.xml'

cspell:
  allow_failure: false
eslint:
  allow_failure: false
phpcs:
  allow_failure: false
phpstan:
  allow_failure: false
phpstan (next minor):
  allow_failure: true
phpstan (previous major):
  rules:
    # We are only interested in PHPStan on the current version.
    - when: never
stylelint:
  allow_failure: false

################
# Coverage
#
# The shared DrupalCI runner image has no code coverage driver installed, so
# the standard "phpunit" job above runs with "--no-coverage" to avoid
# "failOnWarning" turning the missing-driver warning into a hard failure.
#
# This job installs pcov at runtime and re-runs the suite using the project's
# own phpunit.xml (which has a <coverage> block) so coverage is visible in
# this job's log and, if pcov installs successfully, surfaced as a percentage
# badge and inline MR diff annotations. It is independent of and does not
# affect the pass/fail state of the main "phpunit" job.
################
coverage:
  extends: phpunit
  allow_failure: true
  before_script:
    - (pecl install pcov || true)
    - EXT_DIR=$(php -r 'echo ini_get("extension_dir");')
    - "CONF_DIR=$(php --ini | grep 'Scan for additional' | sed 's/.*: //')"
    - |
      if [ -f "$EXT_DIR/pcov.so" ] && [ -d "$CONF_DIR" ]; then
        echo "extension=pcov.so" > "$CONF_DIR/pcov.ini"
      fi
    - php -m | grep -qi pcov && echo "pcov is available for this run." || echo "pcov could not be installed; this job will fail on the missing-driver warning."
  variables:
    # Functional/BrowserTestBase tests spawn a separate PHP process per test,
    # invisible to the coverage driver, so they contribute nothing to the
    # coverage report. Skipping them here avoids duplicating the shared
    # runner's Apache/Chrome/database load that the required "phpunit" job
    # is already generating in parallel, which was otherwise making that
    # job's functional tests intermittently fail.
    #
    # --testsuite is not used for this: the base script always passes a
    # positional test directory ahead of $_PHPUNIT_EXTRA, and PHPUnit
    # ignores --testsuite filtering once a positional path is also given.
    # --exclude-group works regardless, since group filtering does not
    # depend on the <testsuites> directory mapping.
    _PHPUNIT_EXTRA: '--colors=always --testdox --exclude-group decoupled_router_functional'
  coverage: '/^\s*Lines:\s*\d+\.\d+%/'
  artifacts:
    paths:
      - junit.xml
      - $CI_PROJECT_DIR/$_WEB_ROOT/sites/default/files/simpletest
      - $BROWSERTEST_OUTPUT_DIRECTORY
      - apache.access.log.txt
      - apache.error.log.txt
      # Full browsable HTML coverage report, downloadable from the job page.
      - .logs/coverage/phpunit/.coverage-html
      - .logs/coverage/phpunit/cobertura.xml
    reports:
      coverage_report:
        coverage_format: cobertura
        path: .logs/coverage/phpunit/cobertura.xml
