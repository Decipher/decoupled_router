services:
  logger.channel.decoupled_router:
    parent: logger.channel_base
    arguments: ['decoupled_router']
  decoupled_router.router_path_translator.subscriber:
    class: Drupal\decoupled_router\EventSubscriber\RouterPathTranslatorSubscriber
    arguments: ['@service_container', '@logger.channel.decoupled_router', '@router.no_access_checks', '@module_handler', '@config.factory', '@path_alias.manager']
    tags:
      - { name: event_subscriber }
  decoupled_router.cache_invalidation:
    class: Drupal\decoupled_router\CacheInvalidator
    arguments: ['@cache_tags.invalidator', '@entity_type.manager']
  decoupled_router.redirect_compatibility:
    class: Drupal\decoupled_router\RedirectCompatibility
    arguments: ['@module_handler', '@extension.list.module', '@string_translation']
  Drupal\decoupled_router\Hook\DecoupledRouterHooks:
    class: Drupal\decoupled_router\Hook\DecoupledRouterHooks
    arguments: ['@entity_type.manager', '@decoupled_router.cache_invalidation']
  Drupal\decoupled_router\Hook\RequirementsHooks:
    class: Drupal\decoupled_router\Hook\RequirementsHooks
    arguments: ['@decoupled_router.redirect_compatibility']
